# Local Redis and Kafka for rombay-gateway.
# Core and PostgreSQL stay in the rombay-core compose file.
# Redis is configured for the accepted durability limit: AOF every second,
# and noeviction so a full memory limit cannot delete idempotency or job keys.

name: rombay-gateway

services:
  redis:
    image: redis:7.4-alpine
    container_name: rombay-gateway-redis
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --save
      - ""
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - rombay_gateway_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - rombay-net

  kafka:
    image: apache/kafka:3.9.1
    container_name: rombay-gateway-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: 5L6g3nShT-eMCtK--X86sw
    volumes:
      - rombay_gateway_kafka:/tmp/kafka-logs
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - rombay-net

volumes:
  rombay_gateway_redis:
  rombay_gateway_kafka:

networks:
  rombay-net:
    name: rombay-net
    external: true
